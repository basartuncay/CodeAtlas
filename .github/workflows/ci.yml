name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck --workspaces --if-present

      - run: npm test --workspaces --if-present

      - run: npm run lint --workspace=@codeatlas/web

  self-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — computeChurn
          # reads real git log; a shallow clone would make churn numbers
          # meaningless (near-zero history to look at).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Dogfoods the published GitHub Action (action.yml) on this repo:
      # deterministic engine only, no LLM, no API key, no spend.
      # 0.95 is deliberately high: legitimately complex test files already
      # score ~0.87, so the gate catches an extreme regression, not normal work.
      - uses: ./
        with:
          max-hotspot: "0.95"
          output: packages/engine/analysis.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-model
          path: packages/engine/analysis.json
